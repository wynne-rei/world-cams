name: Health check (camera URLs)

on:
  schedule:
    # Every Monday at 00:00 UTC (= 09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run camera health check
        id: probe
        run: node scripts/check-cameras.mjs
        continue-on-error: true

      - name: Open or update tracking issue on failure
        if: steps.probe.outcome != 'success'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.probe.outputs.report }}
          FAILED: ${{ steps.probe.outputs.failed }}
          TOTAL: ${{ steps.probe.outputs.total }}
        with:
          script: |
            const title = '[health-check] Camera URLs reported as down';
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `Run date: **${today}**`,
              `Failed: **${process.env.FAILED}** / ${process.env.TOTAL} probes`,
              '',
              '## Failures',
              process.env.REPORT || '(none)',
              '',
              '> Generated by `.github/workflows/health-check.yml`. Investigate, then either update `data/cameras.json` or close this issue if the source has recovered.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check',
              per_page: 50,
            });
            const existing = open.find((i) => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['health-check'],
              });
            }

      - name: Fail job if probes failed
        if: steps.probe.outcome != 'success'
        run: exit 1
